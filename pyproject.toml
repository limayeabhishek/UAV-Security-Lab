[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securedrone"
version = "0.1.0"
description = "Open UAV Security Research & Assessment Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Abhishek Limaye", email = "researcher@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pymavlink>=2.4.50",
    "pyserial>=3.5",
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "fastcrc>=0.5.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scipy>=1.14.0",
    "scapy>=2.5.0",
]

[project.scripts]
securedrone = "tooling.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "mavlink-security/tests",
    "companion-security/tests",
    "firmware-analysis/unpackers",
    "rf-analysis/signal-processing",
]
norecursedirs = [
    "PX4-Autopilot",
    "venv",
    ".git",
    "AbhishekLimaye_SecureDrone",
    "infrastructure",
    "build",
    "dist"
]

